name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  go-build:
    name: Pocketbase Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: pb/go.mod
          cache-dependency-path: pb/go.sum

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Test
        run: |
          go test -v ./...

      - name: Build
        run: |
          go build -v ./...

  ui-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint

  ui-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Check
        run: npm run check

  ui-build:
    name: Frontend Build and Browser Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm run test:e2e
